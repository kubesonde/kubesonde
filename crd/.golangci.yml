version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

# Pragmatic baseline: focus on correctness linters. Purely stylistic linters
# (lll, goconst, dupl, prealloc, nakedret, gocyclo) are intentionally left off
# for now to keep the gate signal high; they can be re-enabled incrementally.
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests legitimately ignore errors (e.g. fake client Create, resp.Body.Close)
      # and helper error returns; don't fail the build on those.
      - path: _test\.go
        linters:
          - errcheck
      - path: test/utils/
        linters:
          - errcheck
      # Package-level test fixtures reachable only from tests are reported as
      # unused by the non-test analysis; keep them.
      - path: controllers/inner/pods_controller(_features)?\.go
        linters:
          - unused
      # Pre-existing style/quality issues tracked as follow-ups (fixing them is
      # invasive — dot imports, duplicate-aliased imports, quickfix hints, and a
      # few deprecated k8s client calls). Don't block the gate on them yet.
      - linters:
          - staticcheck
        text: "ST1001:"
      - linters:
          - staticcheck
        text: "ST1019"
      - linters:
          - staticcheck
        text: "QF100"
      - linters:
          - staticcheck
        text: "SA1019:"

formatters:
  enable:
    - gofmt
    - goimports
