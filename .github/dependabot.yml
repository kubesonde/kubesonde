version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/crd"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  # Keep GitHub Actions used by our workflows up to date (and patched).
  # Workflows pin every action to a full commit SHA (with a # vX.Y.Z comment);
  # Dependabot preserves that style, bumping the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
