version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/crd"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    # Wait 7 days after a release before opening an update PR, so a freshly
    # published (possibly compromised or broken) version isn't adopted
    # immediately. Security updates are not subject to this cooldown.
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Keep GitHub Actions used by our workflows up to date (and patched).
  # Workflows pin every action to a full commit SHA (with a # vX.Y.Z comment);
  # Dependabot preserves that style, bumping the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
