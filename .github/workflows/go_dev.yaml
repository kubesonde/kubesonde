name: Build and Test controller

on:
  push:
    branches:
      - dev
    paths:
      - crd/**
      - docker/gonetstat/**
      - .github/workflows/go_base.yaml
      - .github/workflows/go_dev.yaml
  pull_request:
    branches:
      - "**"
    paths:
      - crd/**
      - docker/gonetstat/**
      - .github/workflows/go_base.yaml
      - .github/workflows/go_dev.yaml

# Least privilege: deny by default, grant read per job.
permissions: {}

jobs:
  prepare:
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/go_base.yaml

  test-gonetstat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docker/gonetstat/go.mod

      - name: Build
        working-directory: docker/gonetstat
        run: go build ./...

      - name: Test
        working-directory: docker/gonetstat
        run: go test ./...
