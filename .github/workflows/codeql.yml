name: CodeQL

# Automated security/quality code scanning for the Go controller. Results appear
# in the repository's Security > Code scanning tab and inline on pull requests.

on:
  push:
    branches: [main]
    paths:
      - 'crd/**/*.go'
      - 'crd/go.mod'
      - 'crd/go.sum'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crd/**/*.go'
      - 'crd/go.mod'
      - 'crd/go.sum'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to catch newly published advisories.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crd/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual

      # go.mod lives in crd/, so build explicitly instead of relying on autobuild.
      - name: Build
        working-directory: crd
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:go"
