name: Build and test CRD

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crd/go.mod

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Build
        working-directory: crd
        run: make build

      - name: Lint
        working-directory: crd
        run: make lint

      - name: Test
        working-directory: crd
        run: make test

    
      - name: Run gosec 
        working-directory: crd
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -exclude-dir=vendor -exclude-dir=test ./...
          $(go env GOPATH)/bin/gosec -fmt sarif -exclude-dir=vendor -exclude-dir=test -out gosec.sarif ./...

      - name: Upload SARIF file
        if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: gosec.sarif

      - name: Add git safe.directory for container
        run: |
          mkdir -p /home/runner/work/_temp/_github_home
          printf "[safe]\ndirectory = /github/workspace" > /home/runner/work/_temp/_github_home/.gitconfig

      - name: Install govulncheck
        working-directory: crd
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: crd
        run: $(go env GOPATH)/bin/govulncheck ./...
