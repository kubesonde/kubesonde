name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege: deny by default, grant per job only what it needs.
permissions: {}

jobs:
  # Build and test the CRD before releasing anything.
  prepare:
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/go_base.yaml

  build-and-publish:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crd/go.mod
          cache: false

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          lookup-only: true

      - name: Resolve tag
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # The repo-root VERSION file is the single source of truth. Fail the
      # release if the pushed tag doesn't match it, so the file, the git tag,
      # and every published image/manifest can never drift apart.
      - name: Verify tag matches VERSION
        run: |
          expected="v$(cat VERSION)"
          if [ "${STEPS_TAG_OUTPUTS_NAME}" != "$expected" ]; then
            echo "::error::tag ${STEPS_TAG_OUTPUTS_NAME} does not match VERSION file ($expected). Bump VERSION and tag v<VERSION>."
            exit 1
          fi
        env:
          STEPS_TAG_OUTPUTS_NAME: ${{ steps.tag.outputs.name }}

      # Generate the installer manifest (repo-root kubesonde.yaml) pinned to the
      # released controller image tag.
      - name: Create artifact
        working-directory: crd
        run: make artifact IMG=ghcr.io/kubesonde/controller:${STEPS_TAG_OUTPUTS_NAME}
        env:
          STEPS_TAG_OUTPUTS_NAME: ${{ steps.tag.outputs.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push images first so the released manifest always points at an image that
      # actually exists in the registry.
      - name: Build controller image (tag + latest)
        working-directory: crd
        run: |
          make docker-buildx IMG=ghcr.io/kubesonde/controller:${STEPS_TAG_OUTPUTS_NAME}
          make docker-buildx IMG=ghcr.io/kubesonde/controller:latest
        env:
          STEPS_TAG_OUTPUTS_NAME: ${{ steps.tag.outputs.name }}

      - name: Build gonetstat image (tag + latest)
        working-directory: docker
        run: |
          make IMG=ghcr.io/kubesonde/gonetstat:${STEPS_TAG_OUTPUTS_NAME}
          make IMG=ghcr.io/kubesonde/gonetstat:latest
        env:
          STEPS_TAG_OUTPUTS_NAME: ${{ steps.tag.outputs.name }}

      # NOTE: the frontend image is built by its own workflow
      # (frontend_container.yaml) on the same tag, so it ships at the same
      # version. The installer generated above pins that frontend tag.

      # Create the GitHub Release last, attaching the installer manifest and
      # auto-generated release notes from merged PRs / commits since the last tag.
      - name: Create Release
        # zizmor: ignore[superfluous-actions] — the action's generate_release_notes,
        # prerelease handling and asset upload are worth more than a hand-rolled gh script.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          fail_on_unmatched_files: true
          files: kubesonde.yaml

      # Only touch CHANGELOG.md once the release above actually succeeded, so a
      # failed build/publish never leaves a changelog entry for a release that
      # doesn't exist. Skipped for pre-releases (tags containing '-', e.g.
      # v0.9.2-rc.1): release candidates don't belong in the changelog.
      - name: Update CHANGELOG.md
        if: ${{ !contains(steps.tag.outputs.name, '-') }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --prepend CHANGELOG.md --tag ${{ steps.tag.outputs.name }}

      - name: Open changelog PR
        if: ${{ !contains(steps.tag.outputs.name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_TAG_OUTPUTS_NAME: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          branch="changelog-${STEPS_TAG_OUTPUTS_NAME}"
          git checkout -b "$branch"
          git commit -m "docs: update CHANGELOG.md for ${STEPS_TAG_OUTPUTS_NAME}"
          git push --force origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "docs: update CHANGELOG.md for ${STEPS_TAG_OUTPUTS_NAME}" \
            --body "Automated changelog update for ${STEPS_TAG_OUTPUTS_NAME}.")
          gh pr merge "$pr_url" --auto --squash
