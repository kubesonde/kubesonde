name: Build and Test frontend

on:
  push:
    branches:
      - dev
    paths:
      - frontend/**
      - .github/workflows/frontend_base.yaml
      - .github/workflows/frontend_dev.yaml
  pull_request:
    branches:
      - "**"
    paths:
      - frontend/**
      - .github/workflows/frontend_base.yaml
      - .github/workflows/frontend_dev.yaml

# Least privilege: deny by default, grant read per job.
permissions: {}

jobs:
  prepare:
    permissions:
      contents: read
    uses: $/.github/workflows/frontend_base.yaml
