name: Build and Test frontend

on:
  push:
    branches:
      - dev
    paths:
      - frontend/**
      - .github/workflows/frontend_base.yaml
      - .github/workflows/frontend_dev.yaml
  pull_request:
    branches:
      - "**"
    paths:
      - frontend/**
      - .github/workflows/frontend_base.yaml
      - .github/workflows/frontend_dev.yaml

jobs:
  prepare:
    uses: kubesonde/kubesonde/.github/workflows/frontend_base.yaml@main
