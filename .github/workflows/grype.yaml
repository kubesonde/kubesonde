name: Grype image scan

# Builds each container image and scans it with Grype for OS/package CVEs
# (catches a vulnerable base image even when no Dependabot advisory exists).
# Results are uploaded to the Security > Code scanning tab; the job fails on
# High/Critical findings.

on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - 'crd/go.*'
      - 'frontend/package*.json'
      - '.github/workflows/grype.yaml'
  pull_request:
    branches: ["**"]
    paths:
      - '**/Dockerfile'
      - 'crd/go.*'
      - 'frontend/package*.json'
      - '.github/workflows/grype.yaml'
  # Catch newly disclosed CVEs in images that haven't changed.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            context: crd
          - name: frontend
            context: frontend
          - name: gonetstat
            context: docker/gonetstat
          - name: pynetstat
            context: docker/pynetstat
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          platforms: linux/amd64
          tags: kubesonde-scan/${{ matrix.name }}:scan

      - name: Scan with Grype
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: kubesonde-scan/${{ matrix.name }}:scan
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.name }}
